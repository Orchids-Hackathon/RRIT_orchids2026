const A = {
  back, tab: v => tab(v), go: v => go(v),
  modal: v => closeModal(v === '1'),
  side: v => { S.side = v; S.authMsg = null; render(); },
  mode: v => { S.authMode = v; S.authMsg = null; S.f.pass = ''; S.f.pass2 = ''; render(); },
  auth: async () => {
    const f = S.f; S.busy = true; S.authMsg = null; render();
    try {
      if (S.authMode === 'reset') { S.authMsg = { ok: true, text: await Auth.reset(f.email) }; }
      else if (S.authMode === 'signup') {
        const r = await Auth.signUp(f.email, f.pass, f.pass2, S.side);
        if (r === 'verify') { S.authMode = 'signin'; S.f.pass = ''; S.f.pass2 = ''; S.authMsg = { ok: true, text: 'Account created! Open your school inbox, click the link we sent (check Junk too), then sign in.' }; }
      } else await Auth.signIn(f.email, f.pass, S.side);
    } catch (e) { S.authMsg = { ok: false, text: e.message }; S.f.pass = ''; S.f.pass2 = ''; }
    S.busy = false; if (!Auth.user) render();
  },
  saveprofile: () => {
    const name = document.getElementById('p_name').value.trim(), dept = document.getElementById('p_dept').value.trim();
    if (!name || !dept) return toast('Fill in your name and department');
    Auth.saveProfile(name.slice(0, 50), dept.slice(0, 40)); tab(isAdmin() ? 'dash' : 'home');
  },
  account: () => {
    openModal(`<div style="display:flex;align-items:center;gap:12px"><span class="avatar">${esc(initials(me().name))}</span>
      <div><b>${esc(me().name)}</b><p style="font-size:13px">${esc(me().email)}${me().dept ? ' · ' + esc(me().dept) : ''}</p></div></div>
      <p class="hint">${icon(isAdmin() ? 'shield' : 'user', 16)}<span>Using the <b>${isAdmin() ? 'Admin' : 'Teacher'}</b> side</span></p>
      ${me().canSwitch ? `<button class="btn sm" data-a="switchside">${icon(isAdmin() ? 'user' : 'shield', 18)} Switch to ${isAdmin() ? 'Teacher' : 'Admin'} side</button>` : ''}
      ${!isAdmin() ? `<button class="btn ghost sm" data-a="editprofile">Change name or department</button>` : ''}
      <button class="btn danger sm" data-a="signout">${icon('logout', 18)} Sign out</button>
      <button class="btn ghost sm" data-a="modal" data-v="0">Close</button>`);
  },
  editprofile: () => { closeModal(); go('profile'); },
  switchside: () => { closeModal(); Auth.switchSide(); afterSignIn(); toast(isAdmin() ? 'Now on the Admin side' : 'Now on the Teacher side'); },
  signout: async () => { closeModal(); await Auth.signOut(); S.stack = []; S.q = ''; S.dir = 'fade'; S.authMode = 'signin'; render(); },
  floor: v => { S.floor = v; keep.set('rrit_floor', v); render(); },
  askalerts: async () => { try { await Notification.requestPermission(); } catch (e) {} render(); },
  cat: v => go('list', { cat: v }),
  sub: v => { S.listSub = v; render(); },
  open: v => go('detail', { id: v }),
  fav: v => {
    S.favs = S.favs.includes(v) ? S.favs.filter(x => x !== v) : [...S.favs, v];
    keep.set('rrit_favs_' + me().email, JSON.stringify(S.favs)); render();
  },
  colour: v => {
    const m = matById(S.params.id);
    S.sel.colour = v;
    if (!m.variants.some(x => x.colour === v && x.size === S.sel.size)) S.sel.size = m.variants.find(x => x.colour === v).size;
    S.sel.qty = 1; render();
  },
  size: v => { S.sel.size = v; S.sel.qty = 1; render(); },
  pickfloor: v => { S.sel.floor = v; S.sel.qty = 1; render(); },
  step: (v, el) => {
    const k = el.dataset.k, d = +el.dataset.d, min = +el.dataset.min, max = +el.dataset.max;
    const clamp = x => Math.min(max, Math.max(min, x));
    if (k === 'qty') S.sel.qty = clamp(S.sel.qty + d);
    else if (k === 'ret') { S.ret.qty = clamp(S.ret.qty + d); renderReturn(); return; }
    else if (k.startsWith('cart:')) { const l = S.cart[+k.slice(5)]; l.qty = clamp(l.qty + d); saveCart(); }
    else if (k.startsWith('dstock:')) { const fl = k.slice(7), cur = S.draft.variants.find(x => x.id === S.draft.selId) || S.draft.variants[0]; cur.stock[fl] = clamp(st(cur, fl) + d); }
    else if (k.startsWith('new:')) { const fl = k.slice(4); S.draft['new' + fl] = clamp(S.draft['new' + fl] + d); }
    render();
  },
  addcart: () => {
    const m = matById(S.params.id);
    const v = m.variants.find(x => x.colour === S.sel.colour && x.size === S.sel.size);
    const line = S.cart.find(l => l.variantId === v.id && l.floor === S.sel.floor);
    if (line) line.qty += S.sel.qty;
    else S.cart.push({ materialId: m.id, variantId: v.id, name: m.name, colour: v.colour, size: v.size, floor: S.sel.floor, qty: S.sel.qty });
    saveCart(); S.bump = true; S.sel.qty = 1; render();
    toast('Added to cart', { a: 'tab', v: 'cart', label: 'View cart' });
  },
  rmcart: v => { S.cart.splice(+v, 1); saveCart(); render(); },
  clearcart: async () => { if (await ask('Clear cart?', 'This removes everything from your cart.', 'Clear', true)) { S.cart = []; saveCart(); render(); } },
  purpose: v => { S.purpose = v; render(); },
  send: async (v, el) => {
    el.disabled = true; el.textContent = 'Sending…';
    try {
      const items = S.cart.map(({ materialId, variantId, name, colour, size, qty, floor }) => ({ materialId, variantId, name, colour, size, qty, floor }));
      for (const fl of [...new Set(items.map(i => i.floor))]) {
        await Store.take({ userEmail: me().email, name: me().name, dept: me().dept, floor: fl,
          items: items.filter(i => i.floor === fl).map(({ floor, ...rest }) => rest), purpose: S.purpose, note: S.note.trim().slice(0, 140) });
      }
      S.lastSent = items; S.cart = []; S.purpose = ''; S.note = ''; saveCart();
      S.stack = []; S.screen = 'sent'; S.dir = 'fade'; render(); window.scrollTo(0, 0);
    } catch (e) { toast('Could not send: ' + e.message); render(); }
  },
  mytab: v => { S.myTab = v; render(); },
  stafftab: v => { S.tab = v; render(); },
  rettab: v => { S.retTab = v; render(); },
  approve: v => decide(v, true),
  reject: v => decide(v, false),
  openret: (v, el) => {
    const r = Store.requests.find(x => x.id === v), it = r.items.find(i => i.variantId === el.dataset.vid);
    const max = it.qty - returnedQty(r.id, it.variantId);
    S.ret = { requestId: r.id, floor: r.floor, item: it, max, qty: max, condition: 'Good', feedback: '' };
    renderReturn();
  },
  retcond: v => { S.ret.condition = v; renderReturn(); },
  sendret: async () => {
    const r = S.ret;
    if (r.condition !== 'Good' && !r.feedback.trim()) { const e = document.getElementById('ret_err'); e.textContent = 'Please say what happened to it.'; e.style.display = 'flex'; return; }
    try {
      await Store.sendReturn({ requestId: r.requestId, userEmail: me().email, name: me().name, dept: me().dept, floor: r.floor,
        materialId: r.item.materialId, variantId: r.item.variantId, itemName: r.item.name, colour: r.item.colour, size: r.item.size,
        qty: r.qty, condition: r.condition, feedback: r.feedback.trim().slice(0, 200) });
      closeModal(); S.myTab = 'Returns'; render();
      toast(r.condition === 'Good' ? 'Return sent to the store' : 'Damage report sent to the store');
    } catch (e) { toast('Could not send: ' + e.message); }
  },
  confirmret: async v => {
    const card = document.getElementById('t_' + v); card?.classList.add('leaving');
    try { await Store.confirmReturn(v, me().name); toast('Return checked'); }
    catch (e) { card?.classList.remove('leaving'); toast(e.message); }
    render();
  },
  lowstock: () => { S.invCat = 'Low stock'; tab('inventory'); },
  invcat: v => { S.invCat = v; render(); },
  edit: (v, el) => go('edit', { id: v, sel: el.dataset.sel }),
  selvar: v => { S.draft.selId = v; render(); },
  rmvar: v => {
    S.draft.variants = S.draft.variants.filter(x => x.id !== v);
    if (S.draft.selId === v) S.draft.selId = S.draft.variants[0]?.id;
    render();
  },
  quick: (v, el) => { const cur = S.draft.variants.find(x => x.id === S.draft.selId) || S.draft.variants[0]; cur.stock[el.dataset.fl] = st(cur, el.dataset.fl) + +v; render(); },
  addvar: () => {
    const d = S.draft, size = d.newSize.trim() || 'Standard';
    if (d.variants.some(x => x.colour === d.newColour && x.size.toLowerCase() === size.toLowerCase())) return toast('That colour and size already exists');
    const stock = {}; floorsOfCat(d.category).forEach(fl => { stock[fl] = d['new' + fl]; });
    const v = { id: uid(), colour: d.newColour, size, stock };
    d.variants.push(v); d.selId = v.id; d.newSize = ''; render();
    toast(`Added ${v.colour} · ${v.size}`);
  },
  rmphoto: () => { S.draft.photo = ''; render(); },
  savemat: async () => {
    const d = S.draft;
    if (!d.name.trim()) return toast('Give the material a name');
    if (!d.variants.length) return toast('Add at least one option');
    try {
      await Store.updateMaterial(d.id, { name: d.name.trim(), category: d.category, desc: d.desc.trim(), photo: d.photo, variants: d.variants });
      toast('Changes saved'); back();
    } catch (e) { toast('Could not save: ' + e.message); }
  },
  savenew: async () => {
    const d = S.draft;
    if (!d.name.trim()) return toast('Give the material a name');
    const stock = {}; floorsOfCat(d.category).forEach(fl => { stock[fl] = d['new' + fl]; });
    const variants = d.variants.length ? d.variants : [{ id: uid(), colour: d.newColour, size: d.newSize.trim() || 'Standard', stock }];
    try {
      await Store.addMaterial({ name: d.name.trim(), category: d.category, desc: d.desc.trim() || [...new Set(variants.map(v => v.colour))].join(' / '), photo: d.photo, variants });
      toast(`${d.name.trim()} added`); S.invCat = 'All'; back();
    } catch (e) { toast('Could not save: ' + e.message); }
  },
  delmat: async () => {
    if (!await ask(`Delete ${S.draft.name}?`, 'It will disappear for everyone. This cannot be undone.', 'Delete', true)) return;
    await Store.deleteMaterial(S.draft.id); toast('Material deleted'); back();
  },
  catedit: v => go('catedit', { id: v }),
  catfloor: v => { S.draft.floor = v; render(); },
  savecat: async () => {
    const d = S.draft, name = d.name.trim();
    if (!name) return toast('Give the category a name');
    if (Store.categories.some(c => c.name.toLowerCase() === name.toLowerCase() && c.id !== d.id)) return toast('A category with this name already exists');
    try {
      if (d.id) await Store.updateCategory(d.id, { name, photo: d.photo, floor: d.floor });
      else await Store.addCategory({ name, photo: d.photo, grad: d.grad, icon: d.icon, floor: d.floor });
      toast(d.id ? 'Category saved' : `${name} added`); back();
    } catch (e) { toast('Could not save: ' + e.message); }
  },
  delcat: async () => {
    const c = Store.categories.find(x => x.id === S.draft.id);
    const n = Store.materials.filter(m => m.category === c.name).length;
    if (n) return toast(`Move or delete its ${n} material${n === 1 ? '' : 's'} first`);
    if (!await ask(`Delete ${c.name}?`, 'Teachers will no longer see this category.', 'Delete', true)) return;
    await Store.deleteCategory(c.id); toast('Category deleted'); back();
  },
  csv: () => {
    const rows = [['Date', 'Time', 'Teacher', 'Email', 'Department', 'Store', 'Material', 'Colour', 'Size', 'Quantity', 'Purpose', 'Note', 'Returned']];
    Store.requests.filter(r => r.status === 'Borrowed' && inFloor(r.floor)).forEach(r => r.items.forEach(it => rows.push([
      new Date(r.createdAt).toLocaleDateString(), clock(r.createdAt), r.name, r.userEmail, r.dept, FLOORS[r.floor], it.name, it.colour, it.size, it.qty, r.purpose, r.note || '', returnedQty(r.id, it.variantId)
    ])));
    const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'ahis-rrit-usage.csv'; a.click();
  }
};

async function decide(id, approve) {
  const card = document.getElementById('r_' + id);
  card?.classList.add('leaving');
  try {
    await Store.decide(id, approve, me().name);
    toast(approve ? 'Borrow recorded — stock updated' : 'Request cancelled');
  } catch (e) {
    card?.classList.remove('leaving');
    toast(e.message);
  }
  render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) { e.preventDefault(); e.stopPropagation(); fn(el.dataset.v, el, e); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.in; if (!k) return;
  if (k === 'q') { S.q = e.target.value; document.getElementById('results').innerHTML = homeResults(); return; }
  if (k === 'note') { S.note = e.target.value; return; }
  if (k.startsWith('f.')) { S.f[k.slice(2)] = e.target.value; return; }
  if (k.startsWith('r.') && S.ret) { S.ret[k.slice(2)] = e.target.value; return; }
  if (k.startsWith('d.') && S.draft) {
    S.draft[k.slice(2)] = e.target.value;
    if (e.target.dataset.live) { const t = document.querySelector('.cat .cat-name'); if (t) t.textContent = e.target.value || 'Category name'; }
  }
});
document.addEventListener('change', async e => {
  if (e.target.tagName === 'SELECT' && e.target.dataset.in && S.draft) { S.draft[e.target.dataset.in.slice(2)] = e.target.value; render(); }
  if (e.target.dataset.file && e.target.files[0]) {
    toast('Adding photo…');
    try { S.draft.photo = await compressImage(e.target.files[0]); render(); toast('Photo added'); }
    catch (err) { toast('That photo could not be read — try another'); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && S.screen === 'login' && e.target.dataset.in?.startsWith('f.')) { e.target.dispatchEvent(new Event('input', { bubbles: true })); A.auth(); }
  if (e.key === 'Escape' && document.getElementById('modal').classList.contains('show')) closeModal(false);
});

/* =====================================================================
   10) START
   ===================================================================== */
Auth.init(() => { if (Auth.user) afterSignIn(); else { Store.stop(); render(); } });

</script>
